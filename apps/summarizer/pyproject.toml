[project]
name = "munshi-summarizer"
version = "0.1.0"
description = "Publication summarization and metadata extraction engine for Mat Munshi"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jesse", email = "jesse@local" }
]
keywords = ["digital-humanities", "summarization", "mbras", "wiki", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Schema validation & environment loading
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # CLI, ergonomics, & output formatting
    "click>=8.1.0",
    "rich>=13.7.0",

    # Template formatting & LLM client
    "jinja2>=3.1.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
munshi-summarize = "munshi_summarizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munshi_summarizer"]