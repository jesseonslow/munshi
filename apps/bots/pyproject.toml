[project]
name = "munshi-bots"
version = "0.1.0"
description = "Policy-driven LLM Wiki Bot runner for Mat Munshi"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "openai>=1.14.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.14.6",
    "rich>=13.7.0",
]

[project.scripts]
munshi-bot = "munshi_bots.runner:run_policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munshi_bots"]
