[project]
name = "munshi-api"
version = "0.1.0"
description = "Unified Control Plane, Janitorial API, and Graph Reconciler for Mat Munshi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "rich>=13.7.0",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
    "munshi-summarizer",
]

[tool.uv.sources]
munshi-summarizer = { path = "../summarizer" }
