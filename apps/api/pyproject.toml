[project]
name = "munshi-api"
version = "0.1.0"
description = "Control Plane and Reconciler API for Mat Munshi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "click>=8.1.0",
    "rich>=13.7.0",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
    "munshi-summarizer",
    "munshi-docproc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munshi_api"]

[tool.uv.sources]
munshi-summarizer = { path = "../summarizer", editable = true }
munshi-docproc = { path = "../docproc" }
