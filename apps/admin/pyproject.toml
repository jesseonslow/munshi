[project]
name = "munshi-admin"
version = "0.1.0"
description = "Streamlit Administrative Cockpit for Mat Munshi"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munshi_admin"]