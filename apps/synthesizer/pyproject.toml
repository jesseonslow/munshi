[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "munshi-synthesizer"
version = "0.2.0"
description = "MBRAS Topic Synthesizer & Historiographical Literature Review Engine"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "openai>=1.10.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
    "numpy>=1.24.0",
]

[project.scripts]
munshi-synthesizer = "munshi_synthesizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/munshi_synthesizer"]