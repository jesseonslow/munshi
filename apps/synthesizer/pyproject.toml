[project]
name = "munshi-synthesizer"
version = "0.1.0"
description = "Open Knowledge Format (OKF) wiki synthesis engine and citation compiler for Mat Munshi"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jesse", email = "jesse@local" }
]
keywords = ["digital-humanities", "rag", "knowledge-base", "wiki-synthesis", "mbras"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Schema validation & environment management
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # CLI, logging, and console ergonomics
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    # Template formatting & generation
    "jinja2>=3.1.0",
    # LLM API client for OpenRouter / inference providers
    "openai>=1.30.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
munshi-synthesize = "munshi_synthesizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munshi_synthesizer"]
